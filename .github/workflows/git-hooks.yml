name: "Git Hooks"

on:
  push:
    branches:
      - main
  pull_request: ~

permissions: {}

concurrency:
  # GitHub doesn't allow accessing env here, so the value is duplicated to the job step.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-prek:
    name: prek run --all-files
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:
      # GitHub Actions doesn't print the concurrency group in the logs.
      # This is to help debugging potential concurrency issues.
      # https://stackoverflow.com/questions/77571501/
      - name: Export concurrency key
        run: echo "concurrency-key=${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run prek
        uses: j178/prek-action@0bb87d7f00b0c99306c8bcb8b8beba1eb581c037  # v1.1.1
